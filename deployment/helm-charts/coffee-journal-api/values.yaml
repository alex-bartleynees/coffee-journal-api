replicaCount: 1

namespace: "coffee-journal"

image:
  repository: creativefree/coffee-journal-api
  pullPolicy: IfNotPresent
  tag: "e64222a"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 3001

# Non-secret env → ConfigMap. The Keycloak JWKS/issuer are public.
config:
  port: "3001"
  # The cluster is IPv4-only while Backblaze publishes A + AAAA records. Node's
  # dual-stack family race can fail the whole request when IPv6 is unreachable.
  nodeOptions: "--no-network-family-autoselection"
  keycloakJwksUrl: "https://identity.alexbartleynees.com/realms/production/protocol/openid-connect/certs"
  keycloakIssuer: "https://identity.alexbartleynees.com/realms/production"
  keycloakAdminBaseUrl: "https://identity.alexbartleynees.com"
  keycloakAdminRealm: "production"
  keycloakAdminClientId: "admin-cli"
  s3Endpoint: "https://s3.us-east-005.backblazeb2.com"
  s3Region: "us-east-005"
  s3Bucket: "bloom-bean-photos-prod"
  aiBeanExtractionModel: "google/gemini-2.5-flash-lite"
  otlpEndpoint: "http://my-collector-collector.monitoring.svc.cluster.local:4317"
  otlpProtocol: "grpc"
  deploymentEnvironment: "production"

openrouter:
  secretName: "coffee-journal-ai-secret"
  apiKeyKey: "AI_API_KEY"

s3:
  secretName: "coffee-journal-s3-secret"
  accessKeyIdKey: "S3_ACCESS_KEY_ID"
  secretAccessKeyKey: "S3_SECRET_ACCESS_KEY"

keycloakAdmin:
  secretName: "keycloak-auth"
  clientSecretKey: "ADMIN_CLIENT_SECRET"

# DATABASE_URL — full postgres connection string (has credentials) → Secret.
database:
  secretName: "coffee-journal-db-secret"
  connectionStringKey: "DATABASE_URL"

# RABBITMQ_URL — amqp connection string (has credentials) → Secret.
rabbitmq:
  secretName: "coffee-journal-rabbitmq-secret"
  urlKey: "RABBITMQ_URL"

resources:
  requests:
    memory: "96Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "200m"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
